# docker compose up
services:
  db:
    image: postgres:18-alpine
    container_name: stocky_db
    environment:
      POSTGRES_USER: stocky
      POSTGRES_PASSWORD: stocky
      POSTGRES_DB: stocky
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the two app containers need it, which is also why
    # the password above is a placeholder rather than a secret.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocky -d stocky"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: stocky_api
    # Loopback only: there is no authentication.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      STOCKY_DB_DSN: postgresql://stocky:stocky@db:5432/stocky
      STOCKY_HOST: 0.0.0.0        # inside the container; published on loopback
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    container_name: stocky_scheduler
    command: python scheduler.py
    env_file:
      - .env
    environment:
      STOCKY_DB_DSN: postgresql://stocky:stocky@db:5432/stocky
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
